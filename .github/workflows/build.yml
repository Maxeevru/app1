name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Telephony Namespace Error
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        TARGET_FILE=$(find $PUB_CACHE_DIR -name "build.gradle" | grep "telephony")
        if [ -f "$TARGET_FILE" ]; then
          echo "Fixing telephony build.gradle at $TARGET_FILE"
          if ! grep -q "namespace" "$TARGET_FILE"; then
            sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$TARGET_FILE"
          fi
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
