name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Older Plugins Compatibility
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        echo "Removing forbidden package attribute from telephony manifest..."
        
        # Удаляем запрещенный package из манифеста телефонии
        find $PUB_CACHE_DIR -name "AndroidManifest.xml" -type f | while read -r manifest; do
          if grep -q 'package="com.shounakmulay.telephony"' "$manifest"; then
            echo "Removing forbidden package attribute from: $manifest"
            sed -i 's/package="com.shounakmulay.telephony"//g' "$manifest"
          fi
        done

    - name: Build APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=ignore"
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
