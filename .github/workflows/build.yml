name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Older Plugins Compatibility
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        echo "Fixing telephony manifest and build.gradle issues..."
        
        # 1. Удаляем запрещенный package из манифеста телефонии
        find $PUB_CACHE_DIR -name "AndroidManifest.xml" -type f | while read -r manifest; do
          if grep -q 'package="com.shounakmulay.telephony"' "$manifest"; then
            echo "Removing forbidden package attribute from: $manifest"
            sed -i 's/package="com.shounakmulay.telephony"//g' "$manifest"
          fi
        done

        # 2. Прописываем правильный namespace в build.gradle телефонии, чтобы Gradle 9 не ругался
        TARGET_FILE=$(find $PUB_CACHE_DIR -name "build.gradle" | grep "telephony")
        if [ -f "$TARGET_FILE" ]; then
          echo "Injecting namespace into telephony build.gradle at $TARGET_FILE"
          if ! grep -q "namespace" "$TARGET_FILE"; then
            sed -i '/android {/a \    namespace "com.shounakmulay.telephony"' "$TARGET_FILE"
          fi
        fi

    - name: Build APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=ignore"
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
