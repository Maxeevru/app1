name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Older Plugins Compatibility
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        echo "Searching and fixing namespace issues in all downloaded plugins..."
        find $PUB_CACHE_DIR -name "build.gradle" -type f | while read -r file; do
          if ! grep -q "namespace" "$file"; then
            if grep -q "android {" "$file"; then
              echo "Injecting missing namespace into: $file"
              sed -i '/android {/a \    namespace "com.example.fallback_namespace"' "$file"
            fi
          fi
        done

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
