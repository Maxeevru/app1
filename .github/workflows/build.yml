name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Older Plugins Compatibility
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        echo "Searching and fixing compatibility issues in all downloaded plugins..."
        
        # 1. Исправляем ошибку с namespace
        find $PUB_CACHE_DIR -name "build.gradle" -type f | while read -r file; do
          if ! grep -q "namespace" "$file"; then
            if grep -q "android {" "$file"; then
              echo "Injecting missing namespace into: $file"
              sed -i '/android {/a \    namespace "com.example.fallback_namespace"' "$file"
            fi
          fi
        done
        
        # 2. Исправляем ошибку с package в AndroidManifest.xml (для телефонии)
        find $PUB_CACHE_DIR -name "AndroidManifest.xml" -type f | while read -r manifest; do
          if grep -q 'package="com.shounakmulay.telephony"' "$manifest"; then
            echo "Removing forbidden package attribute from: $manifest"
            sed -i 's/package="com.shounakmulay.telephony"//g' "$manifest"
          fi
        done

        # 3. Принудительно поднимаем compileSdk до 34 для всех плагинов (для audioplayers)
        find $PUB_CACHE_DIR -name "build.gradle" -type f | while read -r file; do
          if grep -q "compileSdkVersion" "$file"; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' "$file"
          fi
          if grep -q "compileSdk = " "$file"; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' "$file"
          fi
        done

    - name: Build APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=ignore"
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
