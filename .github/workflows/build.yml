name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Fix Older Plugins Compatibility
      run: |
        PUB_CACHE_DIR="${{ env.PUB_CACHE || '$HOME/.pub-cache' }}"
        echo "Forcing manifest and SDK version updates on all downloaded plugins..."
        
        # 1. Удаляем запрещенный package из манифеста телефонии
        find $PUB_CACHE_DIR -name "AndroidManifest.xml" -type f | while read -r manifest; do
          if grep -q 'package="com.shounakmulay.telephony"' "$manifest"; then
            echo "Removing forbidden package attribute from: $manifest"
            sed -i 's/package="com.shounakmulay.telephony"//g' "$manifest"
          fi
        done

        # 2. Принудительно переписываем compileSdkVersion / compileSdk на 35 во всех плагинах (включая audioplayers)
        find $PUB_CACHE_DIR -name "build.gradle" -type f | while read -r file; do
          if grep -q "compileSdkVersion" "$file"; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' "$file"
          fi
          if grep -q "compileSdk " "$file"; then
            sed -i 's/compileSdk .*/compileSdk = 35/g' "$file"
          fi
          if grep -q "targetSdkVersion" "$file"; then
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' "$file"
          fi
          if grep -q "targetSdk " "$file"; then
            sed -i 's/targetSdk .*/targetSdk = 35/g' "$file"
          fi
        done

        # 3. То же самое делаем для файлов build.gradle.kts (Kotlin DSL)
        find $PUB_CACHE_DIR -name "build.gradle.kts" -type f | while read -r file; do
          if grep -q "compileSdk = " "$file"; then
            sed -i 's/compileSdk = .*/compileSdk = 35/g' "$file"
          fi
          if grep -q "targetSdk = " "$file"; then
            sed -i 's/targetSdk = .*/targetSdk = 35/g' "$file"
          fi
        done

        # 4. 👇 НОВОЕ: добавляем namespace в build.gradle плагина telephony
        find $PUB_CACHE_DIR -path "*/telephony-*/android/build.gradle" -type f | while read -r file; do
          echo "Adding namespace to telephony build.gradle: $file"
          sed -i '/android {/a \    namespace = "com.shounakmulay.telephony"' "$file"
        done

    - name: Build APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.kotlin.jvm.target.validation.mode=ignore"
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
